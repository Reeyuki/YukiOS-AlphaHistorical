<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/DylanThahan28/dw/">
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="x-icon" href="favicon.png">
    <title>UNDERTALE</title>
    <style>
    @-webkit-keyframes rotation {
    from { -webkit-transform: rotate(0deg); }
    to { -webkit-transform: rotate(360deg); }
    }
    @-moz-keyframes rotation {
    from { -moz-transform: rotate(0deg); }
    to { -moz-transform: rotate(360deg); }
    }
    @-o-keyframes rotation {
    from { -o-transform: rotate(0deg); }
    to { -o-transform: rotate(360deg); }
    }
    @keyframes rotation {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
    }
    html { background: #FFFF; }
    body {
    font-family: arial;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    min-height: fill-available;
    min-height: 100vh;
    min-width: 100vw;
    background: radial-gradient(56.63% 56.63% at 50% 43.37%, transparent 0%, transparent 100%);
    background-color: black;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    place-items: center;
    }
    body.scrollingDisabled { overflow: hidden; }
    .emscripten { padding-right: 0; display: block; }
    div.emscripten { text-align: center; font-family: "Lucida Console", Monaco, monospace; }
    canvas.emscripten {
    display: none;
    background-color: black;
    position: flex;
    transition: opacity 5s ease-in;
    -webkit-transition: opacity 5s ease-in;
    opacity: 0;
    filter: blur(0) grayscale(0);
    image-rendering: optimizeSpeed;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: -o-crisp-edges;
    image-rendering: pixelated;
    -ms-interpolation-mode: nearest-neighbor;
    }
    canvas.active { animation-name: fadeIn; animation-duration: 2s; opacity: 1; }
    canvas.paused { animation-name: blur; animation-duration: 0.5s; filter: blur(2px) grayscale(1); }
    canvas.unpaused { animation-name: none; }
    canvas.animatedSizeTransitions { transition: width 0.3s ease, height 0.3s ease; }
    @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
    }
    @keyframes blur {
    0% { filter: blur(0) grayscale(0); }
    100% { filter: blur(2px) grayscale(1); }
    }
    .spinner {
    height: 30px;
    width: 30px;
    -webkit-animation: rotation 0.8s linear infinite;
    -moz-animation: rotation 0.8s linear infinite;
    -o-animation: rotation 0.8s linear infinite;
    animation: rotation 0.8s linear infinite;
    border: 5px solid #bdff00;
    border-top: 5px solid #719900;
    border-radius: 100%;
    }
    #status { display: inline-block; vertical-align: top; font-weight: bold; color: white; }
    #progress { width: 250px; height: 10px; -webkit-appearance: none; appearance: none; padding: 5px; }
    progress[value]::-webkit-progress-bar { background-color: #8492a6; height: 10px; border-radius: 15px; }
    progress[value]::-webkit-progress-value { background-image: -webkit-linear-gradient(left, #719900, #bdff00); height: 10px; border-radius: 15px; }
    div.loading {
    position: absolute;
    top: 0; bottom: 0; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    }
    div.loading > * { padding: 10px; margin: 10px; }
    .output-container { text-align: center; margin-top: auto; }
    .output-button {
    border: none;
    width: 200px;
    height: 25px;
    margin: 5px;
    border-radius: 5px;
    cursor: pointer;
    background-color: black;
    color: white;
    outline-color: #20c20e;
    outline-style: dashed;
    font-family: "Lucida Console", Monaco, monospace;
    }
    #output { display: none; height: 200px; background-color: black; color: white; font-family: "Lucida Console", Monaco, monospace; outline: none; border: none; padding: 0; width: 100%; }
    #message-container { display: none; min-height: 50px; background-color: rgba(20,20,20,0.5); outline: none; border: none; padding: 0; width: 100%; position: absolute; top: 0; }
    #messages { margin-left: 50px; color: white; font-family: "Lucida Console", Monaco, monospace; outline: none; border: none; padding: 0; }
    img.qrCode { opacity: 1.0; width: 50%; height: 50%; }
    #pauseMenuContainer { position: absolute; top: 0; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; align-items: center; }
    #pauseMenuContainer[hidden] { display: none !important; opacity: 0; }
    #pauseMenuBorder {
    background: linear-gradient(135deg, #FA1E4E, transparent 40%);
    padding: 1px;
    border-radius: 4px;
    clip-path: polygon(10.5px 0, 100% 0, 100% 100%, 0 100%, 0 10.5px);
    width: 70vw;
    max-width: 400px;
    }
    #pauseMenu {
    display: flex;
    flex-direction: column;
    padding: 60px 30px 60px 30px;
    background: linear-gradient(180deg, #2E273F 16.15%, rgba(46,39,63,0.79) 56.25%, #2E273F 91.15%);
    border-radius: 4px;
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
    animation-name: fadeIn;
    animation-duration: 0.5s;
    opacity: 1;
    }
    #pauseMenu button { font-weight: 500; font-size: 17px; color: white; background: #FA1E4E; border: 1px solid #FA1E4E; border-radius: 6px; padding: 12px 24px; margin: 5px 0; -webkit-user-select: none; user-select: none; }
    #pauseMenu button#quitButton { background: #FA1E4E40; }
    #pauseMenu button:hover { filter: brightness(1.15); }
    #pauseMenu button:active { filter: brightness(0.85); }
    #pauseMenu button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="pauseMenuContainer" hidden>
      <div id="pauseMenuBorder">
        <div id="pauseMenu">
          <button id="resumeButton" onclick="resume()">Resume</button>
          <button id="quitButton" onclick="quitIfSupported()">Quit</button>
        </div>
      </div>
    </div>
    <div class="loading">
      <div class="spinner" id="spinner"></div>
      <div class="emscripten" id="status">Downloading...(faster now. new repo)</div>
      <progress value="0" max="100" id="progress" hidden="1"></progress>
    </div>
    <div id="message-container">
      <div id="messages"></div>
    </div>

    <script>
    const blob = new Blob([document.querySelector('#tick-worker').textContent]);
    const worker = new Worker(window.URL.createObjectURL(blob));
    worker.onmessage = function () { GM_tick(performance.now()); }
    const isMultiplayer = function () {
      if (typeof GM_is_multiplayer !== 'function') return false;
      return GM_is_multiplayer() !== 0;
    }
    document.addEventListener('visibilitychange', function () {
      if (!isMultiplayer()) return;
      if (document.visibilityState === 'hidden') worker.postMessage({run: true, fps: 60});
      else worker.postMessage({run: false});
    });
    </script>

    <script>
    function mergeFiles(fileParts) {
      return new Promise((resolve, reject) => {
        let buffers = [];
        function fetchPart(index) {
          if (index >= fileParts.length) {
            let mergedBlob = new Blob(buffers);
            let mergedFileUrl = URL.createObjectURL(mergedBlob);
            resolve(mergedFileUrl);
            return;
          }
          fetch(fileParts[index]).then((response) => response.arrayBuffer()).then((data) => {
            buffers.push(data);
            fetchPart(index + 1);
          }).catch(reject);
        }
        fetchPart(0);
      });
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
      return parts;
    }

    mergeFiles(getParts("game.unx", 1, 5)).then(async url => {
      window.gameUnxUrl = url;
      const originalFetch = window.fetch;
      window.fetch = async function (...args) {
        let [url, options] = args;
        if (typeof url === 'string' && url.includes("game.unx")) { console.log("fetch:", url); url = window.gameUnxUrl; }
        else if (url instanceof Request && url.url.includes("game.unx")) { console.log("fetch request:", url.url); url = new Request(window.gameUnxUrl, url); }
        return originalFetch.call(this, url, options);
      };
      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
        if (url.includes("game.unx")) { console.log("XHR:", url); url = window.gameUnxUrl; }
        return originalOpen.call(this, method, url, ...rest);
      };
      let index = document.createElement("script");
      index.src = "index.js";
      document.body.appendChild(index);
      let runner = document.createElement("script");
      runner.src = "runner.js";
      document.body.appendChild(runner);
    }).catch(error => { console.error("Failed to merge files:", error); });
    </script>

    <script>
    const IDB = '/_savedata', STORE = 'FILE_DATA';

    function openDB() {
      return new Promise((res, rej) => {
        const r = indexedDB.open(IDB);
        r.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
        r.onsuccess = e => res(e.target.result);
        r.onerror = e => rej(e.target.error);
      });
    }

    function enc(v) { let s=''; const u=new Uint8Array(v.buffer,v.byteOffset,v.byteLength); for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
    function dec(b,T) { const s=atob(b),u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return new T(u.buffer); }

    function serialize(entries) {
      const o={};
      for (const [k,v] of Object.entries(entries))
        o[k] = v?.timestamp !== undefined ? {_t:'f',ts:+v.timestamp,mode:v.mode,data:enc(v.contents)}
              : ArrayBuffer.isView(v) ? {_t:v.constructor.name,data:enc(v)} : v;
      return o;
    }

    function deserialize(entries) {
      const o={};
      for (const [k,v] of Object.entries(entries))
        o[k] = v?._t==='f' ? {timestamp:new Date(v.ts),mode:v.mode,contents:dec(v.data,Int8Array)}
              : v?._t ? dec(v.data, globalThis[v._t]??Uint8Array) : v;
      return o;
    }

    async function dbGetAll() {
      const db=await openDB();
      return new Promise((res,rej) => {
        const tx=db.transaction(STORE,'readonly'),st=tx.objectStore(STORE);
        let keys,vals;
        st.getAllKeys().onsuccess=e=>keys=e.target.result;
        st.getAll().onsuccess=e=>vals=e.target.result;
        tx.oncomplete=()=>{db.close();const o={};keys.forEach((k,i)=>o[k]=vals[i]);res(o);};
        tx.onerror=e=>{db.close();rej(e.target.error);};
      });
    }

    async function dbPutAll(entries) {
      const db=await openDB();
      return new Promise((res,rej) => {
        const tx=db.transaction(STORE,'readwrite'),st=tx.objectStore(STORE);
        for (const [k,v] of Object.entries(entries)) st.put(v,k);
        tx.oncomplete=()=>{db.close();res();};
        tx.onerror=e=>{db.close();rej(e.target.error);};
      });
    }

    function toast(msg, err) {
      const t=document.getElementById('save-toast');
      if (!t) return;
      t.textContent=msg; t.style.color=err?'#f99':'#9f9'; t.style.borderColor=err?'#933':'#3a3';
      t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200);
    }

    async function exportSave() {
      try {
        const e=await dbGetAll();
        if (!Object.keys(e).length) return toast('no save data found.',true);
        const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([JSON.stringify(serialize(e))],{type:'application/json'})),download:'understory.dylan'});
        a.click(); URL.revokeObjectURL(a.href); toast('save exported!',false);
      } catch { toast('export failed.',true); }
    }

    async function importSave(file) {
      if (!confirm('Warning: importing will overwrite your Undertale AND Deltarune save data. Continue?')) return;
      try {
        await dbPutAll(deserialize(JSON.parse(await file.text())));
        toast('save loaded! reloading...',false);
        setTimeout(()=>location.reload(),1200);
      } catch(e) { console.error(e); toast('invalid save file.',true); }
    }

    function injectSaveBar() {
      if (document.getElementById('save-bar')) return;
      document.head.insertAdjacentHTML('beforeend',`<style>
        #save-bar{position:fixed;bottom:18px;right:18px;display:flex;gap:8px;z-index:9999}
        #save-bar button{background:rgba(0,0,0,.75);color:#ccc;border:1px solid #444;padding:6px 14px;font-size:12px;letter-spacing:.08em;cursor:pointer;font-family:inherit;transition:.15s}
        #save-bar button:hover{background:rgba(255,255,255,.08);color:#fff;border-color:#888}
        #save-toast{position:fixed;bottom:58px;right:18px;background:rgba(0,0,0,.85);border:1px solid #3a3;padding:6px 14px;font-size:12px;letter-spacing:.08em;font-family:inherit;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999}
        #save-toast.show{opacity:1}
      </style>`);
      document.body.insertAdjacentHTML('beforeend',`<div id="save-bar"><button id="btn-import">IMPORT SAVE</button><button id="btn-export">EXPORT SAVE</button><input id="import-input" type="file" accept=".dylan" style="display:none"></div><div id="save-toast"></div>`);
      document.getElementById('btn-export').addEventListener('click', exportSave);
      document.getElementById('btn-import').addEventListener('click', ()=>{ alert('Any .dylan file works here. deltaroom.dylan and understory.dylan are both compatible.'); document.getElementById('import-input').click(); });
      document.getElementById('import-input').addEventListener('change', function(){ if(this.files[0]){importSave(this.files[0]);this.value='';} });
    }

    injectSaveBar();
    </script>
  </body>
</html>
